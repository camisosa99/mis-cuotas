<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Camila Sosa">
    <title>Mis Cuotas — Detalle</title>
    <link rel="stylesheet" href="node_modules/@tabler/icons-webfont/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="form-header">
            <a href="home.html" class="btn-back">
                <i class="ti ti-chevron-left"></i>
            </a>
            <div class="detalle-header-info">
                <div class="form-title" id="detalle-nombre"></div>
                <div class="detalle-subtitulo" id="detalle-subtitulo"></div>
            </div>
            <a href="nueva-cuota.html" class="btn-editar-header">
                <i class="ti ti-pencil"></i>
            </a>
        </div>

        <!-- CARD PRINCIPAL -->
        <div class="detalle-hero">
            <div class="detalle-hero-label" id="hero-label"></div>
            <div class="detalle-hero-monto" id="hero-monto"></div>
            <div class="detalle-hero-sub" id="hero-sub"></div>
            <div class="detalle-progress-bar">
                <div class="detalle-progress-fill" id="hero-progreso" style="width: 0%;"></div>
            </div>
        </div>

        <!-- GRILLA DE DATOS -->
        <div class="detalle-grid">
            <div class="detalle-dato">
                <div class="detalle-dato-label">Ya pagaste</div>
                <div class="detalle-dato-valor" id="dato-pagado"></div>
                <div class="detalle-dato-sub" id="dato-pagado-sub"></div>
            </div>
            <div class="detalle-dato">
                <div class="detalle-dato-label">Falta pagar</div>
                <div class="detalle-dato-valor" id="dato-falta"></div>
                <div class="detalle-dato-sub" id="dato-falta-sub"></div>
            </div>
        <div class="detalle-dato">
            <div class="detalle-dato-label">Tarjeta</div>
            <div class="detalle-dato-valor">
                <span class="detalle-tarjeta-dot" id="dato-tarjeta-dot"></span>
                <span id="dato-tarjeta"></span>
            </div>
            <div class="detalle-dato-sub" id="dato-cierre"></div>
        </div>
        <div class="detalle-dato">
            <div class="detalle-dato-label">Última cuota</div>
            <div class="detalle-dato-valor" id="dato-ultima"></div>
            <div class="detalle-dato-sub" id="dato-ultima-sub"></div>
        </div>
    </div>  

        <!-- HISTORIAL -->
    <div class="detalle-section-title">Historial de cuotas</div>
    <div class="timeline" id="timeline"></div>

    <!-- NOTAS -->
    <div id="seccion-notas">
        <div class="detalle-section-title">Notas</div>
        <div class="detalle-notas" id="detalle-notas"></div>
    </div>

    <!-- BOTÓN ELIMINAR -->
    <button class="btn-eliminar" id="btn-eliminar">
        <i class="ti ti-trash"></i>
        Eliminar cuota
    </button>

</div>

<script type="module" src="detalle-cuota.js"></script>


</body>
</html>
