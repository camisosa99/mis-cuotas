<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Camila Sosa">
    <title>Mis Cuotas</title>
    <link rel="stylesheet" href="node_modules/@tabler/icons-webfont/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="home-header">
            <div class="app-name">Mis cuotas</div>
            <div class="header-actions">
                <button id="btn-logout" class="btn-logout">
                    <i class="ti ti-logout"></i>
                </button>
                <a href="nueva-cuota.html" class="btn-add">
                    <i class="ti ti-plus"></i>
                </a>
            </div>
        </div>

        <!-- NAVEGADOR DE MESES -->
        <div class="month-nav">
            <button class="month-arrow" id="btn-mes-anterior">
                <i class="ti ti-chevron-left"></i>
            </button>
            <span class="month-label" id="month-label"></span>
            <button class="month-arrow" id="btn-mes-siguiente">
                <i class="ti ti-chevron-right"></i>
            </button>
       </div>

        <!-- TOTAL DEL MES -->
        <div class="total-card">
            <div class="total-label">Total del mes</div>
            <div class="total-amount" id="total-amount">$0</div>
            <div class="total-cards" id="total-cards"></div>
        </div>

        <!-- LISTA DE CUOTAS -->
        <div class="cuotas-list" id="cuotas-list"></div>

        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <i class="ti ti-calendar"></i>
                <span>Inicio</span>
            </a>
            <a href="tarjetas.html" class="nav-item">
                <i class="ti ti-credit-card"></i>
                <span>Tarjetas</span>
            </a>
        </nav>

    </div>

    <script type="module" src="home.js"></script>

</body>
</html>
